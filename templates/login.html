<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rajbhasha Exam - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e8eef5);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;

            font-size: 28px;

            color: #222;
        }

        .header p {
            margin-top: 10px;

            color: #666;

            font-size: 15px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;
        }

        input:focus {
            outline: none;

            border-color: #555;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .message {
            padding: 12px;

            margin-bottom: 20px;

            border-radius: 8px;

            background: #f1f1f1;

            color: #333;

            font-size: 14px;
        }

        .register-link {
            text-align: center;

            margin-top: 20px;

            font-size: 14px;
        }

        .register-link a {
            color: #222;

            font-weight: bold;

            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .admin-link {
            text-align: center;

            margin-top: 25px;

            font-size: 13px;
        }

        .admin-link a {
            color: #777;

            text-decoration: none;
        }

        @media (max-width: 500px) {

            .container {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="header">

            <h1>Rajbhasha Exam</h1>

            <p>Participant Login</p>

        </div>


        <!-- Flash Messages -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Login Form -->

        <form method="POST">

            <label for="registration_id">
                Registration ID
            </label>

            <input
                type="text"
                id="registration_id"
                name="registration_id"
                placeholder="Enter your Registration ID"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div class="register-link">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register here
            </a>

        </div>


        <div class="admin-link">

            <a href="{{ url_for('admin_login') }}">
                Admin Login
            </a>

        </div>

    </div>

</body>

</html>
