<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rajbhasha Exam - Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #f5f7fa,
                #e8eef5
            );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        .container {

            width: 100%;

            max-width: 430px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.12);
        }


        .header {

            text-align: center;

            margin-bottom: 30px;
        }


        .lock {

            font-size: 45px;

            margin-bottom: 10px;
        }


        .header h1 {

            margin: 0;

            font-size: 27px;

            color: #222;
        }


        .header p {

            margin-top: 10px;

            color: #666;

            font-size: 14px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }


        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;
        }


        input:focus {

            outline: none;

            border-color: #555;
        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background: #444;
        }


        .message {

            padding: 12px;

            margin-bottom: 20px;

            border-radius: 8px;

            background: #f1f1f1;

            color: #333;

            font-size: 14px;
        }


        .back-link {

            text-align: center;

            margin-top: 25px;

            font-size: 14px;
        }


        .back-link a {

            color: #222;

            font-weight: bold;

            text-decoration: none;
        }


        .back-link a:hover {

            text-decoration: underline;
        }


        @media (max-width: 500px) {

            .container {

                padding: 25px 20px;
            }

            .header h1 {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <div class="lock">
            🔐
        </div>

        <h1>
            Admin Login
        </h1>

        <p>
            Rajbhasha Objective Examination
        </p>

    </div>


    <!-- Flash Messages -->

    {% with messages =
        get_flashed_messages(
            with_categories=true
        )
    %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- Admin Login Form -->

    <form method="POST">


        <label for="username">
            Admin Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter admin username"
            required
            autocomplete="username"
        >


        <label for="password">
            Admin Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter admin password"
            required
            autocomplete="current-password"
        >


        <button type="submit">
            Login to Dashboard
        </button>


    </form>


    <div class="back-link">

        <a href="{{ url_for('login') }}">
            ← Participant Login
        </a>

    </div>


</div>


</body>

</html>
