{% extends "base.html" %}

{% block content %}

<style>
    .quiz-container {
        max-width: 900px;
        margin: 30px auto;
    }

    .quiz-header {
        background: white;
        padding: 25px;
        border-radius: 15px;
        margin-bottom: 25px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .quiz-header h1 {
        margin: 0 0 10px 0;
        font-size: 30px;
    }

    .participant-name {
        font-size: 18px;
        color: #555;
    }

    .question-card {
        background: white;
        padding: 25px;
        margin-bottom: 20px;
        border-radius: 15px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .question-number {
        font-weight: bold;
        font-size: 18px;
        margin-bottom: 12px;
    }

    .question-text {
        font-size: 19px;
        font-weight: 600;
        margin-bottom: 20px;
        line-height: 1.5;
    }

    .options {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .option {
        border: 1px solid #d0d0d0;
        border-radius: 10px;
        padding: 14px 16px;
        cursor: pointer;
        transition: 0.2s;
        background: #fafafa;
    }

    .option:hover {
        background: #f0f0f0;
    }

    .option input {
        margin-right: 10px;
    }

    .option-label {
        font-weight: bold;
        margin-right: 8px;
    }

    .submit-section {
        background: white;
        padding: 25px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .submit-button {
        background: #222;
        color: white;
        border: none;
        padding: 15px 40px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    .submit-button:hover {
        background: #000;
    }
</style>


<div class="quiz-container">

    <div class="quiz-header">
        <h1>Rajbhasha Exam</h1>

        <div class="participant-name">
            Participant:
            <strong>{{ participant.name }}</strong>
        </div>
    </div>


    <form method="POST" id="quizForm">

        {% for question in questions %}

        <div class="question-card">

            <div class="question-number">
                Question {{ loop.index }}
            </div>

            <div class="question-text">
                {{ question.question_text }}
            </div>


            <div class="options">

                <!--
                    IMPORTANT:
                    The VALUE remains the original answer letter.
                    Only the visual order is shuffled.
                -->

                <label class="option">
                    <input
                        type="radio"
                        name="question_{{ question.id }}"
                        value="A"
                    >
                    <span class="option-label">A.</span>
                    <span class="option-text">
                        {{ question.option_a }}
                    </span>
                </label>


                <label class="option">
                    <input
                        type="radio"
                        name="question_{{ question.id }}"
                        value="B"
                    >
                    <span class="option-label">B.</span>
                    <span class="option-text">
                        {{ question.option_b }}
                    </span>
                </label>


                <label class="option">
                    <input
                        type="radio"
                        name="question_{{ question.id }}"
                        value="C"
                    >
                    <span class="option-label">C.</span>
                    <span class="option-text">
                        {{ question.option_c }}
                    </span>
                </label>


                <label class="option">
                    <input
                        type="radio"
                        name="question_{{ question.id }}"
                        value="D"
                    >
                    <span class="option-label">D.</span>
                    <span class="option-text">
                        {{ question.option_d }}
                    </span>
                </label>

            </div>

        </div>

        {% endfor %}


        <div class="submit-section">

            <p>
                Please check all your answers before submitting.
            </p>

            <button
                type="submit"
                name="submit_test"
                value="yes"
                class="submit-button"
                onclick="return confirmSubmit();"
            >
                Submit Test
            </button>

        </div>

    </form>

</div>


<script>

function shuffleOptions() {

    const questionCards =
        document.querySelectorAll(".question-card");

    questionCards.forEach(function(card) {

        const optionsContainer =
            card.querySelector(".options");

        if (!optionsContainer) {
            return;
        }

        const options =
            Array.from(
                optionsContainer.children
            );

        // Fisher-Yates shuffle
        for (
            let i = options.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() * (i + 1)
                );

            [
                options[i],
                options[j]
            ] = [
                options[j],
                options[i]
            ];
        }

        options.forEach(function(option, index) {

            const label =
                option.querySelector(
                    ".option-label"
                );

            const newLetter =
                String.fromCharCode(
                    65 + index
                );

            label.textContent =
                newLetter + ".";

            optionsContainer.appendChild(
                option
            );

        });

    });

}


function confirmSubmit() {

    return confirm(
        "Are you sure you want to submit the examination?\n\n" +
        "You will not be able to change your answers after submission."
    );

}


// Shuffle options when the page loads
window.addEventListener(
    "DOMContentLoaded",
    shuffleOptions
);

</script>

{% endblock %}
