{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="exam-header">
        <div>
            <h2>Rajbhasha Exam</h2>
            <p>Participant: <strong>{{ participant.name }}</strong></p>
        </div>

        <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
    </div>

    <form method="POST" onsubmit="return confirmSubmit();">

        {% for q in questions %}

        <div class="question-card">

            <div class="question-number">
                Question {{ loop.index }}
            </div>

            <div class="question-text">
                {{ q.question }}
            </div>

            <div class="options">

                {% for option in q.options %}

                <label class="option">
                    <input
                        type="radio"
                        name="question_{{ q.id }}"
                        value="{{ option.letter }}"
                        required
                    >

                    <span class="option-letter">
                        {{ option.letter }}
                    </span>

                    <span class="option-text">
                        {{ option.text }}
                    </span>
                </label>

                {% endfor %}

            </div>

        </div>

        {% endfor %}

        <div class="submit-section">
            <button type="submit" class="submit-btn">
                Submit Exam
            </button>
        </div>

    </form>

</div>


<style>

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}

.exam-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding: 20px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.exam-header h2 {
    margin: 0 0 5px 0;
}

.exam-header p {
    margin: 0;
    color: #555;
}

.logout-btn {
    text-decoration: none;
    background: #dc3545;
    color: white;
    padding: 9px 16px;
    border-radius: 6px;
}

.question-card {
    background: white;
    margin-bottom: 20px;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.question-number {
    font-weight: bold;
    color: #555;
    margin-bottom: 10px;
}

.question-text {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 18px;
    line-height: 1.6;
}

.options {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    background: #f5f5f5;
}

.option input {
    margin: 0;
}

.option-letter {
    font-weight: bold;
    min-width: 25px;
}

.option-text {
    line-height: 1.5;
}

.submit-section {
    text-align: center;
    margin: 30px 0;
}

.submit-btn {
    background: #198754;
    color: white;
    border: none;
    padding: 13px 35px;
    font-size: 17px;
    border-radius: 8px;
    cursor: pointer;
}

.submit-btn:hover {
    background: #157347;
}

@media (max-width: 600px) {

    .container {
        padding: 10px;
        margin: 10px auto;
    }

    .exam-header {
        padding: 15px;
    }

    .question-card {
        padding: 16px;
    }

    .question-text {
        font-size: 16px;
    }

}

</style>


<script>

function confirmSubmit() {

    return confirm(
        "Are you sure you want to submit the exam?\n\n" +
        "You will not be able to change your answers after submission."
    );

}

</script>

{% endblock %}
